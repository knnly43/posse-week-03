<!DOCTYPE html>
<html lang="ja">
<head class="fixed top-0 left-0 w-full bg-white flex items-center justify-between px-6py-4">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介カード</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 py-8">
    <main class="max-w-4xl mx-auto px-4">
    <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">チームレタスマン</h1>

    <!-- カードを横3枚並びにする。スマホでは縦1列 -->
    <div class="flex flex-col md:flex-row gap-8">

        <div class="bg-white rounded-lg shadow p-6 flex flex-col items-center">
            <span class="text-4xl">🍅</span>
            <h2 class="text-lg font-bold text-gray-900 mt-3">内田広翔</h2>
            <p class="text-gray-600 text-sm mt-2 text-center">トマト担当。バドミントン部</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 flex flex-col items-center">
            <span class="text-4xl">🥒</span>
            <h2 class="text-lg font-bold text-gray-900 mt-3">後藤亮太</h2>
            <p class="text-gray-600 text-sm mt-2 text-center">きゅうり担当。サッカー部</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 flex flex-col items-center">
            <span class="text-4xl">🌽</span>
            <h2 class="text-lg font-bold text-gray-900 mt-3">長岡璃央</h2>
            <p class="text-gray-600 text-sm mt-2 text-center">とうもろこし担当。ねこ部</p>
        </div>

    </div>
    </main>
</body>
</html>
